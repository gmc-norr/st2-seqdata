---
name: copy_lymphotrack_or_kitm
description: >
  Rule for checking if a BCLConvert run belongs to a
  lymphotrack or KITM sequencing run, and if so, move
  files to a shared directory
pack: gmc_norr_seqdata
enabled: true

trigger:
  type: cleve.analysis_state_update

criteria:
  trigger.state:
    type: equals
    pattern: ready
  trigger.software:
    type: contains
    pattern: BCLConvert
  trigger.path:
    type: contains
    pattern: miseq

action:
  ref: gmc_norr_seqdata.copy_lymphotrack_or_kitm
  parameters:
    analysis_id: "{{ trigger.analysis_id }}"
