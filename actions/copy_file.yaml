name: copy_file
runner_type: orquesta
description: Copy the any file from an analysis
enabled: true
entry_point: workflows/copy_file.yaml

parameters:
  file_path:
    type: string
    required: true
    description: Path to sequencing run
  type:
    type: string
    required: true
    description: type of file
  run_id:
    type: string
    required: false
    description: Run that genereted files is based on
  pipeline:
    type: string
    required: true
    description: Pipeline that generated file
  subdir:
    type: string
    required: false
    description: Optional sub directory that file will be copied to
  destination:
    type: string
    required: false
    description: >
      Base directory where the file should be copied to. If missing,
      an attempt to fetch it from the pack config is made. If the directory
      doesn't exist it will be created.
